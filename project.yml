name: VaultFolio
options:
  bundleIdPrefix: com.vaultfolio
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  VaultFolio:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VaultFolio
    resources:
      - path: VaultFolio/Resources/Assets.xcassets
      - path: VaultFolio/Resources/LaunchScreen.storyboard
    info:
      path: VaultFolio/App/Info.plist
      properties:
        CFBundleDisplayName: PPCF Atlas
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIUserInterfaceStyle: Light
        NSCameraUsageDescription: PPCF Atlas uses the camera so you can capture receipts and add them to your transaction records.
        NSPhotoLibraryUsageDescription: PPCF Atlas needs access to your photo library so you can attach existing receipts and asset images.
        NSPhotoLibraryAddUsageDescription: PPCF Atlas saves exported reports and charts to your photo library when you choose to share them.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaultfolio.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UIUserInterfaceStyle: Light